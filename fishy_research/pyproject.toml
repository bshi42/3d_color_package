[project]
name = "fishy-research"
version = "0.1.0"
description = "Research harness for improving color-based population cluster analysis on the synthetic 'fishy' dataset (3D Slicer color-DeCA module)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "imageio>=2.31",
    "umap-learn>=0.5.4",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fishpipe"]

[tool.uv]
# keep resolution simple/reproducible for non-expert devs
package = true
