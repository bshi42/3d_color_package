[project]
name = "learned-color-space"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "click>=8.4.1",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pyqt5>=5.15.11",
    "pyvista>=0.48.4",
    "pyvistaqt>=0.11.4",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.40",
    "triton>=3.7.1; sys_platform == 'linux'",
    "triton-rocm>=3.7.1; sys_platform == 'linux'",
    "umap-learn>=0.5.5",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
