<svg viewBox="0 0 1000 1200" version="1.1" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="black" /></marker><linearGradient id="fish_grad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#8f7c6b" /><stop offset="50%" stop-color="#b59f8c" /><stop offset="100%" stop-color="#6e5e50" /></linearGradient></defs><g><text x="500" y="60" fill="black" font-family="sans-serif" font-size="32px" font-weight="bold" text-anchor="middle">Workflow: Multi-Recolor (Multi-texture Clustering)</text><rect x="50" y="150" width="900" height="200" fill="#f9f9f9" stroke="#cccccc" rx="5" stroke-width="1" /><text x="70" y="190" fill="black" font-family="sans-serif" font-size="24px" font-weight="bold" text-anchor="start">Step 1: Extract Aligned Textures</text><text x="70" y="220" fill="#555" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Extracts aligned textures from the generated Atlas UV space for all specimens.</text><polygon points="140.0,280 80.0,235.0 80.0,325.0" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><polygon points="170.0,257.5 215.0,220.0 230.0,257.5" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><ellipse cx="200" cy="280" rx="75.0" ry="37.5" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><path d="M 230.0 247.0 A 50 25 0 0 1 275.0 280 A 50 25 0 0 1 230.0 313.0 Z" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><circle cx="252.5" cy="272.5" r="4.5" fill="black" /><text x="200" y="340" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">3D Specimen</text><line x1="300" y1="280" x2="450" y2="280" stroke="black" stroke-width="3" marker-end="url(#arrow)" /><rect x="500" y="230" width="150" height="100" fill="url(#fish_grad)" stroke="black" rx="5" stroke-width="2" /><text x="575" y="350" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">UV Texture Flat Map</text><rect x="50" y="400" width="900" height="200" fill="#f9f9f9" stroke="#cccccc" rx="5" stroke-width="1" /><text x="70" y="440" fill="black" font-family="sans-serif" font-size="24px" font-weight="bold" text-anchor="start">Step 2: K-Means Clustering for Shared Palette</text><text x="70" y="470" fill="#555" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Applies K-Means Clustering across all pooled textures to create a universal 8-color palette.</text><rect x="150" y="490" width="10" height="10" fill="#635345" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="502" width="10" height="10" fill="#4a3c31" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="514" width="10" height="10" fill="#3b453a" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="526" width="10" height="10" fill="#b8a89a" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="538" width="10" height="10" fill="#b8a89a" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="550" width="10" height="10" fill="#8c7a6b" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="562" width="10" height="10" fill="#635345" stroke="none" rx="0" stroke-width="2" /><rect x="150" y="574" width="10" height="10" fill="#635345" stroke="none" rx="0" stroke-width="2" /><rect x="162" y="490" width="10" height="10" fill="#7aa385" stroke="none" rx="0" stroke-width="2" /><rect x="162" y="502" width="10" height="10" fill="#4a3c31" stroke="none" rx="0" stroke-width="2" /><rect x="162" y="514" width="10" height="10" fill="#4a3c31" stroke="none" rx="0" stroke-width="2" /><rect x="162" y="526" width="10" height="10" fill="#635345" stroke="none" rx="0" stroke-width="2" /><rect x="162" y="538" width="10" height="10" fill="#b8a89a" stroke="none" rx="0" stroke-width="2" /><rect x="162" y="550" width="10" height="10" fill="#b8a89a" stroke="none" rx="0" stroke-width="2" /><rect x=