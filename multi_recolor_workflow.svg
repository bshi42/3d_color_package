"258" y="514" width="10" height="10" fill="#635345" stroke="none" rx="0" stroke-width="2" /><rect x="258" y="526" width="10" height="10" fill="#b8a89a" stroke="none" rx="0" stroke-width="2" /><rect x="258" y="538" width="10" height="10" fill="#546b5a" stroke="none" rx="0" stroke-width="2" /><rect x="258" y="550" width="10" height="10" fill="#b8a89a" stroke="none" rx="0" stroke-width="2" /><rect x="258" y="562" width="10" height="10" fill="#2a3b4c" stroke="none" rx="0" stroke-width="2" /><rect x="258" y="574" width="10" height="10" fill="#7aa385" stroke="none" rx="0" stroke-width="2" /><text x="205" y="600" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">Millions of Raw Pixels</text><line x1="300" y1="530" x2="450" y2="530" stroke="black" stroke-width="3" marker-end="url(#arrow)" /><rect x="500" y="510" width="30" height="40" fill="#4a3c31" stroke="black" rx="5" stroke-width="2" /><rect x="535" y="510" width="30" height="40" fill="#635345" stroke="black" rx="5" stroke-width="2" /><rect x="570" y="510" width="30" height="40" fill="#8c7a6b" stroke="black" rx="5" stroke-width="2" /><rect x="605" y="510" width="30" height="40" fill="#b8a89a" stroke="black" rx="5" stroke-width="2" /><rect x="640" y="510" width="30" height="40" fill="#3b453a" stroke="black" rx="5" stroke-width="2" /><rect x="675" y="510" width="30" height="40" fill="#546b5a" stroke="black" rx="5" stroke-width="2" /><rect x="710" y="510" width="30" height="40" fill="#7aa385" stroke="black" rx="5" stroke-width="2" /><rect x="745" y="510" width="30" height="40" fill="#2a3b4c" stroke="black" rx="5" stroke-width="2" /><text x="635" y="580" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">8 Consolidated Clusters</text><rect x="50" y="650" width="900" height="200" fill="#f9f9f9" stroke="#cccccc" rx="5" stroke-width="1" /><text x="70" y="690" fill="black" font-family="sans-serif" font-size="24px" font-weight="bold" text-anchor="start">Step 3: Quantize Individual Textures</text><text x="70" y="720" fill="#555" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Maps every pixel in each specimen to the nearest color in the shared palette.</text><polygon points="140.0,780 80.0,735.0 80.0,825.0" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><polygon points="170.0,757.5 215.0,720.0 230.0,757.5" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><ellipse cx="200" cy="780" rx="75.0" ry="37.5" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><path d="M 230.0 747.0 A 50 25 0 0 1 275.0 780 A 50 25 0 0 1 230.0 813.0 Z" fill="url(#fish_grad)" stroke="black" stroke-width="1" /><circle cx="252.5" cy="772.5" r="4.5" fill="black" /><text x="200" y="840" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">Original Continuous Texture</text><line x1="330" y1="780" x2="450" y2="780" stroke="black" stroke-width="3" marker-end="url(#arrow)" /><polygon points="540.0,780 480.0,735.0 480.0,825.0" fill="#3b453a" stroke="black" stroke-width="1" /><polygon points="570.0,757.5 615.0,720.0 630.0,757.5" fill="#7aa385" stroke="black" stroke-width="1" /><ellipse cx="600" cy="780" rx="75.0" ry="37.5" fill="#8c7a6b" stroke="black" stroke-width="1" /><path d="M 630.0 747.0 A 50 25 0 0 1 675.0 780 A 50 25 0 0 1 630.0 813.0 Z" fill="#2a3b4c" stroke="black" stroke-width="1" /><circle cx="652.5" cy="772.5" r="4.5" fill="black" /><text x="600" y="840" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">Quantized Texture (Discrete)</text><rect x="50" y="900" width="900" height="250" fill="#f9f9f9" stroke="#cccccc" rx="5" stroke-width="1" /><text x="70" y="940" fill="black" font-family="sans-serif" font-size="24px" font-weight="bold" text-anchor="start">Step 4: Morphospace / PCA Analysis</text><text x="70" y="970" fill="#555" font-family="sans-serif" font-size="16px" font-weight="normal" text-anchor="start">Performs PCA on quantized color patterns to construct a Morphospace for population comparison.</text><line x1="350" y1="1100" x2="650" y2="1100" stroke="black" stroke-width="3" marker-end="url(#arrow)" /><line x1="500" y1="1120" x2="500" y2="1000" stroke="black" stroke-width="3" marker-end="url(#arrow)" /><text x="660" y="1105" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="start">PC1</text><text x="480" y="990" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="start">PC2</text><circle cx="400" cy="1080" r="6" fill="#2a3b4c" stroke="black" /><circle cx="420" cy="1060" r="6" fill="#8c7a6b" stroke="black" /><circle cx="380" cy="1090" r="6" fill="#3b453a" stroke="black" /><circle cx="550" cy="1040" r="6" fill="#8c7a6b" stroke="black" /><circle cx="570" cy="1020" r="6" fill="#b8a89a" stroke="black" /><circle cx="540" cy="1060" r="6" fill="#3b453a" stroke="black" /><circle cx="510" cy="1050" r="6" fill="#7aa385" stroke="black" /><circle cx="470" cy="1030" r="6" fill="#7aa385" stroke="black" /><circle cx="610" cy="1080" r="6" fill="#546b5a" stroke="black" /><text x="500" y="1130" fill="black" font-family="sans-serif" font-size="14px" font-weight="bold" text-anchor="middle">Specimen Scatter Plot in Morphospace</text></g></svg>